name: Build Sideloadable IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Camera Permission
        run: /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Need camera for PS4 stream'" $(find . -name "Info.plist" | grep -v "Pods" | head -n 1) || true
      - name: Build App
        run: |
          xcodebuild clean build -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath ./build/DerivedData
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r ./build/DerivedData/Build/Products/Release-iphoneos/*.app ./build/Payload/
          cd build
          zip -qr app.ipa Payload/
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: build/app.ipa
